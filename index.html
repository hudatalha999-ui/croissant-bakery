<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freshly Baked Croissants</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff9f2;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #d38c3c;
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .hero {
            padding: 50px 20px;
            background-image: linear-gradient(to bottom, #d38c3c, #f4a460);
            color: white;
        }
        .hero h2 {
            font-size: 3em;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .hero p {
            font-size: 1.2em;
            font-weight: bold;
        }
        .offer-card {
            background-color: white;
            width: 80%;
            max-width: 400px;
            margin: -30px auto 30px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 3px solid #d38c3c;
        }
        .offer-card h3 {
            color: #d38c3c;
            font-size: 1.8em;
            margin-top: 0;
        }
        .price {
            font-size: 2em;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
        }
        .btn {
            display: inline-block;
            background-color: #27ae60;
            color: white;
            padding: 15px 30px;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #219150;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            padding: 15px 0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Croissant Bakery</h1>
    </header>

    <div class="hero">
        <h2>FRESHLY BAKED</h2>
        <p>Up to 50% Off - Order Now!</p>
    </div>

    <div class="offer-card">
        <h3>Special Daily Deal</h3>
        <p style="font-size: 1.2em; font-weight: bold;">4 Croissants + 1 FREE!</p>
        <div class="price">Only 650 PKR</div>
        <p>Garam, naram aur mazedar croissants abhi order karein!</p>
        
        <!-- Apne WhatsApp number ko yahan update karein (923XXXXXXXXX format mein) -->
        <a href="https://wa.me/923290334083?text=Salam! Main 650 PKR wali 4+1 Free Croissant deal order karna chahta hoon." class="btn" target="_blank">
            WhatsApp Par Order Karein
        </a>
    </div>

    <footer>
        <p>&copy; 2026 Croissant Bakery. All Rights Reserved.</p>
    </footer>

</body>
</html>
